# CareWave EMR v2.0 - Production Docker Compose for VPS Deployment

services:
  # ----------------------------------------------------
  # 1. POSTGRESQL DATABASE (with pgvector for multi-tenant & shared SaaS schemas)
  # ----------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aegis-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be provided in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aegis_his_production}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis_prod_user} -d ${POSTGRES_DB:-aegis_his_production}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegis_internal_network

  # ----------------------------------------------------
  # 2. REDIS SESSION & QUEUE CACHE
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aegis-prod-redis
    restart: always
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegis_internal_network

  # ----------------------------------------------------
  # 3. NESTJS BACKEND API (Pre-built Cloud Image from GHCR)
  # ----------------------------------------------------
  backend:
    image: ghcr.io/tanoy-git/health-backend:prod
    container_name: aegis-prod-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegis_prod_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aegis_his_production}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1d}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aegis_internal_network

  # ----------------------------------------------------
  # 4. NEXT.JS FRONTEND WEB APP (Pre-built Cloud Image from GHCR)
  # ----------------------------------------------------
  frontend:
    image: ghcr.io/tanoy-git/health-frontend:prod
    container_name: aegis-prod-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/health-erp}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/health-erp/api/v1}
      BACKEND_INTERNAL_URL: http://backend:4000
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - backend
    networks:
      - aegis_internal_network

networks:
  aegis_internal_network:
    name: aegis_internal_network
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
