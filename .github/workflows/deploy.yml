name: CI/CD Auto Deploy to VPS

on:
  push:
    branches:
      - prod # Trigger automatically on push to prod branch
  workflow_dispatch: # Allow manual trigger anytime

jobs:
  build-and-push-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          push: true
          tags: ghcr.io/tanoy-git/health-backend:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-frontend:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          push: true
          tags: ghcr.io/tanoy-git/health-frontend:prod
          build-args: |
            NEXT_PUBLIC_BASE_PATH=/health-erp
            NEXT_PUBLIC_API_URL=/health-erp/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Remote VPS
    needs: [build-and-push-backend, build-and-push-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: GH_PAT
          timeout: 120s
          command_timeout: 10m
          script: |
            set -e
            DEPLOY_PATH="/home/tny/source/health-center-management-system"

            # 1. Clone repository if not already present on VPS
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "📦 Cloning health-center-management-system repository..."
              mkdir -p /home/tny/source
              if [ -n "$GH_PAT" ]; then
                git clone -b prod https://$GH_PAT@github.com/tanoy-git/health-center-management-system.git "$DEPLOY_PATH"
              else
                git clone -b prod https://github.com/tanoy-git/health-center-management-system.git "$DEPLOY_PATH"
              fi
            fi

            cd "$DEPLOY_PATH"

            # 2. Authenticate Docker with GitHub Container Registry if GH_PAT is present
            if [ -n "$GH_PAT" ]; then
              git remote set-url origin https://$GH_PAT@github.com/tanoy-git/health-center-management-system.git
              echo "$GH_PAT" | docker login ghcr.io -u tanoy-git --password-stdin 2>/dev/null || true
            fi

            # 3. Pull latest code and execute self-contained deploy script
            git fetch origin prod
            git reset --hard origin/prod
            chmod +x deploy.sh
            ./deploy.sh
